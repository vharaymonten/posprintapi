version: "3.9"

services:
  printer-api:
    build: .
    container_name: printer-api
    ports:
      - "9191:9191"
    restart: unless-stopped
    environment:
      PRINTER_SQLITE_DB_PATH: "/data/printers.sqlite3"
      PRINTER_PRINTERS_CONFIG_PATH: "/app/printers.yaml"
      PRINTER_PRINT_LOG_PATH: "/data/logs/print_failures.log"
      # Print dispatch: per-printer sliding-window pacing and backlog.
      # Keep queue depth near rate_limit * wait_timeout -- see API_CONTRACTS.md.
      PRINTER_PRINT_RATE_LIMIT: "4"
      PRINTER_PRINT_RATE_WINDOW_SECONDS: "1.0"
      PRINTER_PRINT_MAX_QUEUE_DEPTH: "20"
      PRINTER_PRINT_WAIT_TIMEOUT_SECONDS: "5.0"
    volumes:
      - printer_data:/data
      - ./printers.yaml:/app/printers.yaml:ro
    # Note: CORS is configured in app/core/config.py
    # Edit cors_origins in that file to change allowed origins
    # environment:
    #   PRINTER_TEMPLATES_DIR: "/app/receipt_templates"

volumes:
  printer_data:
